<style>
  :root {
    --paper: #f0ede8;
    --paper-dark: #e4e0d8;
    --ink: #2c2825;
    --ink-muted: #7a7570;
    --ink-soft: #9a9590;
    --accent: #7a6e63;
    --line: #c8c2b8;
    --line-soft: #d8d2c8;
  }
  html, body, #root {
    margin: 0; padding: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Source Serif 4', Georgia, serif;
  }
  .display-font { font-family: 'Playfair Display', Georgia, serif; }
  .mono-font   { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  .grain::before {
    content: ""; position: fixed; inset: 0;
    pointer-events: none; opacity: 0.035;
    mix-blend-mode: multiply; z-index: 100;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .fade-in { animation: fadeIn 0.6s ease-out both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .drop-cap::first-letter {
    font-family: 'Playfair Display', serif; font-weight: 900;
    float: left; font-size: 4.2em; line-height: 0.85;
    padding-right: 0.08em; padding-top: 0.08em;
    color: var(--accent);
  }

  .rule { height: 1px; background: var(--line); }
  .rule-double { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); height: 5px; }

  .card-hover { transition: transform 0.25s ease, box-shadow 0.25s ease; }
  .card-hover:hover { transform: translateY(-2px); box-shadow: 0 12px 32px -16px rgba(26, 22, 18, 0.25); }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
  .pulse { animation: pulse 2s ease-in-out infinite; }

  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }

  .btn-outline { border: 1px solid var(--ink); padding: 0.375rem 0.75rem; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; font-family: 'JetBrains Mono', monospace; display: inline-flex; align-items: center; gap: 0.375rem; transition: all 0.15s ease; background: transparent; color: var(--ink); cursor: pointer; }
  .btn-outline:hover { background: var(--ink); color: var(--paper); }
  .btn-outline:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-outline:disabled:hover { background: transparent; color: var(--ink); }

  .btn-primary { background: var(--ink); color: var(--paper); padding: 1rem 2rem; font-family: 'JetBrains Mono', monospace; font-size: 14px; text-transform: uppercase; letter-spacing: 0.2em; transition: background 0.2s ease; border: none; cursor: pointer; }
  .btn-primary:hover { background: var(--accent); }

  .ico { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: inline-block; vertical-align: middle; }

const DEFAULT_SOURCES_CZ = [
  { name: "iRozhlas", url: "irozhlas.cz", enabled: true },
  { name: "ČT24", url: "ct24.ceskatelevize.cz", enabled: true },
  { name: "Seznam Zprávy", url: "seznamzpravy.cz", enabled: true },

];

];
const DEFAULT_SOURCES_OPINION = [
  { name: "Respekt", url: "respekt.cz", enabled: true },
  { name: "Forbes CZ", url: "forbes.cz", enabled: true },
  { name: "Reportér", url: "reportermagazin.cz", enabled: true },
  { name: "CzechCrunch", url: "czechcrunch.cz", enabled: true },
];

  { name: "TechCrunch", url: "techcrunch.com", enabled: true },
  { name: "The Verge", url: "theverge.com", enabled: true },

];

  { id: "cz-politics", label: "Česká politika", enabled: true },
  { id: "world-politics", label: "Zahraniční politika", enabled: true },
  { id: "economy", label: "Ekonomika a byznys", enabled: true },
  { id: "culture", label: "Kultura a společnost", enabled: true },
  { id: "tech", label: "Věda a technologie", enabled: false },
  { id: "sport", label: "Sport", enabled: false },
];
const CATEGORY_COLORS = {
  "Česká politika": "var(--accent)",
  "Zahraniční politika": "#8b5a3c",
  "Ekonomika": "#4a6b4a",
  "Kultura": "#7a4a6b",
  "Technologie": "#3a5a7a",
  "Společnost": "#6b5a3c",
  "Sport": "#5a5a5a",
};

const BANNED_DOMAINS = ["eurozpravy.cz", "eurozpravy.eu", "blesk.cz", "denikreferendum.cz", "forum24.cz", "a2larm.cz", "konzervativni-noviny.cz"];

const storage = {
  get: (k) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};

function App() {
  const [apiKey, setApiKey] = useState(null);
  const [apiKeyInput, setApiKeyInput] = useState("");
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [loadingStage, setLoadingStage] = useState("");
  const [error, setError] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  const [settings, setSettings] = useState({
    sourcesCz: DEFAULT_SOURCES_CZ,
    sourcesWorld: DEFAULT_SOURCES_WORLD,
    sourcesOpinion: DEFAULT_SOURCES_OPINION,
    sourcesAi: DEFAULT_SOURCES_AI,
    topics: DEFAULT_TOPICS,
    summaryLength: "medium",
  });
  const [lastUpdated, setLastUpdated] = useState(null);

  useEffect(() => {
    const k = storage.get("brifink.apiKey"); if (k) setApiKey(k);
    const s = storage.get("brifink.settings");
    if (s) {
      // Přidej nové zdroje které v uloženém nastavení ještě nejsou
      const mergeNew = (saved, defaults) => {
        const savedUrls = new Set(saved.map(x => x.url));
        return [...saved, ...defaults.filter(d => !savedUrls.has(d.url))];
      };
      const merged = {
        ...s,
        sourcesCz: mergeNew(s.sourcesCz || [], DEFAULT_SOURCES_CZ),
        sourcesWorld: mergeNew(s.sourcesWorld || [], DEFAULT_SOURCES_WORLD),
        sourcesOpinion: mergeNew(s.sourcesOpinion || [], DEFAULT_SOURCES_OPINION),
        sourcesAi: mergeNew(s.sourcesAi || [], DEFAULT_SOURCES_AI),
      };
      setSettings(merged);
      storage.set("brifink.settings", merged);
    }
    const d = storage.get("brifink.latestDigest");
    // Zahoď cache ve staré struktuře nebo bez AI sekce
    if (d && d.data && d.data.sections && Array.isArray(d.data.sections)) {
      const hasAi = d.data.sections.some(s => s.id === "ai");
      if (hasAi) {
        setData(d.data); setLastUpdated(d.timestamp);
      } else {
        localStorage.removeItem("brifink.latestDigest");
      }
    } else if (d) {
      localStorage.removeItem("brifink.latestDigest");
    }
  }, []);

  const saveSettings = (s) => { setSettings(s); storage.set("brifink.settings", s); };

  const saveApiKey = () => {
    const t = apiKeyInput.trim();
    if (!t.startsWith("sk-ant-")) {
      alert("API klíč by měl začínat 'sk-ant-'. Zkontroluj, jestli jsi ho zkopírovala celý.");
      return;
    }
    storage.set("brifink.apiKey", t);
    setApiKey(t);
    setApiKeyInput("");
  };

  const clearApiKey = () => {
    if (confirm("Opravdu smazat uložený API klíč?")) {
      localStorage.removeItem("brifink.apiKey");
      setApiKey(null);
      setShowSettings(false);
    }
  };

  const resetSettings = () => {
    if (confirm("Resetovat všechny zdroje na výchozí hodnoty? Tvůj API klíč zůstane zachován.")) {
      const fresh = {
        sourcesCz: DEFAULT_SOURCES_CZ,
        sourcesWorld: DEFAULT_SOURCES_WORLD,
        sourcesOpinion: DEFAULT_SOURCES_OPINION,
        sourcesAi: DEFAULT_SOURCES_AI,
        topics: DEFAULT_TOPICS,
        summaryLength: "medium",
      };
      setSettings(fresh);
      storage.set("brifink.settings", fresh);
    }
  };

  // Sestavení promptu pro CZ nebo WORLD fázi
  const buildPrompt = (scope, dateStr, timeOfDay) => {
    const isCz = scope === "CZ";
    const newsSources = isCz
      ? settings.sourcesCz.filter(s => s.enabled).map(s => s.name + " (" + s.url + ")").join(", ")
      : settings.sourcesWorld.filter(s => s.enabled).map(s => s.name + " (" + s.url + ")").join(", ");
    const opinionSources = settings.sourcesOpinion.filter(s => s.enabled).map(s => s.name + " (" + s.url + ")").join(", ");
    const focusInstr = isCz
      ? "Soustřeď se VÝHRADNĚ na dění v ČESKU. Žádné zahraniční zprávy."
      : "Soustřeď se VÝHRADNĚ na ZAHRANIČNÍ a mezinárodní dění. Žádné české zprávy.";
    const sections = isCz
      ? [{ id: "cz-politics", title: "Česká politika" }, { id: "cz-society", title: "Česko: společnost a kultura" }]
      : [{ id: "world-politics", title: "Svět: politika a mezinárodní dění" }, { id: "world-society", title: "Svět: společnost a kultura" }];
    const allDomains = [...newsSources.matchAll(/\(([^)]+)\)/g)].map(m => m[1]).join(", ");

    return `Jsi redaktor zpravodajského dashboardu. Dnes je ${dateStr}, ${timeOfDay} vydání.

ZPRAVODAJSKÉ ZDROJE: ${newsSources}
NÁZOROVÉ A ANALYTICKÉ ZDROJE: ${opinionSources}
${focusInstr}
Preferuj výsledky z těchto domén: ${allDomains}.
PŘÍSNÝ ZÁKAZ — tyto zdroje nesmíš použít ani citovat za žádných okolností: eurozpravy.cz, eurozpravy.eu, blesk.cz, denikreferendum.cz, forum24.cz, a2larm.cz, konzervativni-noviny.cz. Pokud se objeví ve výsledcích vyhledávání, ignoruj je.

POKYNY:
- Proveď MAXIMÁLNĚ 2 webová vyhledávání: "${isCz ? "nejdůležitější české zprávy dnes" : "top world news today"}" a "${isCz ? "česká politika společnost dnes" : "international politics society today"}".
- Pro každou ze 2 sekcí vyber 4–6 nejpokrývanějších témat. Žádná vata, žádné lokální kuriozity.
- U každé zprávy odhadni coverage_count = přibližný počet různých médií která téma pokrývají.
- summary: 2–4 věty — co se stalo, kdo je aktér, co je podstatné.
- opinions: krátký odstavec čerpající z názorových zdrojů (${opinionSources}) — jaké jsou hlavní názorové tábory, co je sporné, co říkají kritici vs. zastánci. Bez vlastních hodnotových soudů, jen popis pozic.

VRAŤ POUZE VALIDNÍ JSON (žádný text před ani po, žádné markdown fences):

{
  "searches_used": ["první dotaz", "druhý dotaz"],
  "sources_checked": ["seznam domén které jsi použil"],
  "sections": [
    ${sections.map(s => `{
      "id": "${s.id}",
      "title": "${s.title}",
      "scope": "${scope}",
      "items": [
        {
          "rank": 1,
          "headline": "Výstižný titulek — co se stalo (max 90 znaků)",
          "coverage_count": 5,
          "summary": "2–4 věty: co se stalo, kdo je aktér, co je podstatné.",
          "opinions": "Krátký odstavec o názorech, kontroverzích a náladě debaty.",
          "sources": [
            { "name": "Název média", "url": "https://url-konkrétního-článku" },
            { "name": "Další médium", "url": "https://url" }
          ]
        }
      ]
    }`).join(",\n    ")}
  ]
}

PRAVIDLA: Pouze JSON. Každá sekce 4–6 položek seřazených od nejvyššího coverage_count. Rank od 1 v každé sekci. URL MUSÍ být přesné přímé URL konkrétního článku z výsledků vyhledávání — ne homepage, ne doména, ne vymyšlená URL. Pokud nemáš přesné URL článku, raději zdroj vynech. Min 2 zdroje na položku. Piš česky, neutrálně. Klíče v dvojitých uvozovkách, escapuj \\" uvnitř hodnot, žádné trailing commas.`;
  };

  // Prompt pro WORLD fázi — zahrnuje světové zprávy + AI sekci
  const buildPromptWorld = (dateStr, timeOfDay) => {
    const worldSources = settings.sourcesWorld.filter(s => s.enabled).map(s => s.name + " (" + s.url + ")").join(", ");
    const aiSources = settings.sourcesAi.filter(s => s.enabled).map(s => s.name + " (" + s.url + ")").join(", ");
    const opinionSources = settings.sourcesOpinion.filter(s => s.enabled).map(s => s.name + " (" + s.url + ")").join(", ");
    const allDomains = [...(worldSources + ", " + aiSources).matchAll(/\(([^)]+)\)/g)].map(m => m[1]).join(", ");

    return `Jsi redaktor zpravodajského dashboardu. Dnes je ${dateStr}, ${timeOfDay} vydání.

ZPRAVODAJSKÉ ZDROJE (svět): ${worldSources}
AI & TECH ZDROJE: ${aiSources}
NÁZOROVÉ ZDROJE: ${opinionSources}
Preferuj výsledky z těchto domén: ${allDomains}.
PŘÍSNÝ ZÁKAZ — tyto zdroje nesmíš použít ani citovat za žádných okolností: eurozpravy.cz, eurozpravy.eu, blesk.cz, denikreferendum.cz, forum24.cz, a2larm.cz, konzervativni-noviny.cz. Pokud se objeví ve výsledcích vyhledávání, ignoruj je.

POKYNY:
- Proveď MAXIMÁLNĚ 2 webová vyhledávání: "top world news today" a "artificial intelligence AI news today".
- První hledání použij pro světové zprávy (politika + společnost), druhé pro AI sekci.
- ŘAĎ PODLE POKRYTÍ: téma pokrývané více médii = důležitější.
- Pro světové sekce (politika, společnost) vyber 4–5 témat každou. Pro AI sekci 4–5 témat.
- U každé zprávy odhadni coverage_count = přibližný počet různých médií která téma pokrývají.
- summary: 2–4 věty — co se stalo, kdo je aktér, co je podstatné.
- opinions: krátký odstavec — hlavní názorové tábory, co je sporné, reakce odborníků. Bez vlastních hodnotových soudů.

VRAŤ POUZE VALIDNÍ JSON (žádný text před ani po, žádné markdown fences):

{
  "searches_used": ["první dotaz", "druhý dotaz"],
  "sources_checked": ["seznam domén které jsi použil"],
  "sections": [
    {
      "id": "world-politics",
      "title": "Svět: politika a mezinárodní dění",
      "scope": "WORLD",
      "items": [
        {
          "rank": 1,
          "headline": "Výstižný titulek (max 90 znaků)",
          "coverage_count": 5,
          "summary": "2–4 věty: co se stalo, kdo je aktér, co je podstatné.",
          "opinions": "Krátký odstavec o názorech a kontroverzích.",
          "sources": [
            { "name": "Název média", "url": "https://url-článku" },
            { "name": "Další médium", "url": "https://url" }
          ]
        }
      ]
    },
    {
      "id": "world-society",
      "title": "Svět: společnost a kultura",
      "scope": "WORLD",
      "items": []
    },
    {
      "id": "ai",
      "title": "Umělá inteligence",
      "scope": "WORLD",
      "items": []
    }

      let esc = false;
      for (let i = 0; i < s.length; i++) {
        const c = s[i];
        if (esc) { out += c; esc = false; continue; }
        if (c === "\\") { out += c; esc = true; continue; }
        if (c === '"') {
          if (!inStr) {
            inStr = true; out += c;
          } else {
            const rest = s.slice(i + 1).trimStart();
            const next = rest[0];
            if (!next || CLOSE_CHARS.has(next)) {
              inStr = false; out += c;
            } else {
              out += '\\"';
            }
          }
          continue;
        }
        out += c;
      }
      return out;

      if (parsed.__err) {

          const idx = str.lastIndexOf(marker);
          if (idx === -1) return null;
          const arrStart = str.indexOf("[", idx);
          if (arrStart === -1) return null;
          const head = str.slice(0, arrStart + 1);
          const tail = str.slice(arrStart + 1);
          const objectEnds = [];
          let depth = 0, inStr = false, esc = false;
          for (let i = 0; i < tail.length; i++) {
            const c = tail[i];
            if (esc) { esc = false; continue; }
            if (c === "\\") { esc = true; continue; }
            if (c === '"') { inStr = !inStr; continue; }
            if (inStr) continue;
            if (c === "{") depth++;
            else if (c === "}") { depth--; if (depth === 0) objectEnds.push(i); }
          }

              <div className="text-center">
                <div className="display-font italic text-lg mb-2" style={{ color: "var(--ink-muted)" }}>— konec vydání —</div>
                <div className="mono-font text-[10px] uppercase tracking-[0.25em]" style={{ color: "var(--ink-soft)" }}>Sestaveno umělou inteligencí · {new Date().toLocaleDateString("cs-CZ")}</div>
              </div>
            </footer>
          </>
        )}
      </main>

      {showSettings && (
        <div className="fixed inset-0 z-50 flex items-start justify-center p-4 overflow-y-auto"
          style={{ background: "rgba(26, 22, 18, 0.6)" }}
          onClick={() => setShowSettings(false)}>
          <div className="max-w-2xl w-full my-8 p-8 fade-in" style={{ background: "var(--paper)", border: "2px solid var(--ink)" }} onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-6">
              <h2 className="display-font text-3xl font-bold">Nastavení</h2>
              <button onClick={() => setShowSettings(false)} style={{ background: "transparent", border: "none", cursor: "pointer", padding: "4px" }}><IconX size={20} /></button>
            </div>
            <div className="rule mb-6"></div>

            {[
              { title: "České zdroje", key: "sourcesCz", items: settings.sourcesCz },
              { title: "Zahraniční zdroje", key: "sourcesWorld", items: settings.sourcesWorld },
              { title: "Názory & komentáře", key: "sourcesOpinion", items: settings.sourcesOpinion },
              { title: "AI & technologie", key: "sourcesAi", items: settings.sourcesAi },
            ].map(section => (
              <div className="mb-6" key={section.key}>
                <h3 className="mono-font text-[11px] uppercase tracking-[0.25em] mb-3" style={{ color: "var(--accent)" }}>{section.title}</h3>
                <div className="grid grid-cols-2 gap-2">
                  {section.items.map((item, i) => (
                    <button key={i}
                      onClick={() => {
                        const newItems = [...section.items];
                        newItems[i] = { ...item, enabled: !item.enabled };
                        saveSettings({ ...settings, [section.key]: newItems });
                      }}
                      className="flex items-center gap-2 p-2 text-left text-sm"
                      style={{
                        border: "1px solid " + (item.enabled ? "var(--ink)" : "var(--line-soft)"),
                        color: item.enabled ? "var(--ink)" : "var(--ink-soft)",
                        background: "transparent", cursor: "pointer"
                      }}>
                      <div style={{ width: 16, height: 16, border: "1px solid var(--ink)", display: "flex", alignItems: "center", justifyContent: "center", background: item.enabled ? "var(--ink)" : "transparent", flexShrink: 0 }}>
                        {item.enabled && <span style={{ color: "var(--paper)", display:"flex" }}><IconCheck size={10} /></span>}
                      </div>
                      {item.name || item.label}
                    </button>
                  ))}
                </div>
              </div>
            ))}



            <div className="rule mb-4"></div>

            <div className="mb-4">
              <h3 className="mono-font text-[11px] uppercase tracking-[0.25em] mb-3" style={{ color: "var(--accent)" }}>API klíč</h3>
              <div className="flex items-center gap-2 mono-font text-xs" style={{ color: "var(--ink-muted)" }}>
                <IconKey size={12} />
                <span>Uložen v prohlížeči</span>
                <button onClick={clearApiKey} style={{ background: "transparent", border: "none", cursor: "pointer", color: "var(--accent)", textDecoration: "underline", marginLeft: "auto" }}>Smazat klíč</button>
              </div>
            </div>

            <div className="rule mb-4"></div>

            <div className="mb-4">
              <h3 className="mono-font text-[11px] uppercase tracking-[0.25em] mb-3" style={{ color: "var(--accent)" }}>Obnovit výchozí nastavení</h3>
              <button onClick={resetSettings} className="btn-outline w-full justify-center" style={{ borderColor: "var(--accent)", color: "var(--accent)" }}>
                Resetovat všechny zdroje na výchozí
              </button>
              <div className="mono-font text-[9px] mt-2" style={{ color: "var(--ink-soft)" }}>Odstraní staré/nežádoucí zdroje a obnoví aktuální výchozí seznam. API klíč zůstane.</div>
            </div>

            <div className="mono-font text-[10px] uppercase tracking-wider text-center" style={{ color: "var(--ink-soft)" }}>Nastavení se ukládá automaticky</div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
